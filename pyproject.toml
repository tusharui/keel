[project]
name = "keel"
version = "0.1.0"
description = "A control plane for LLM inference workloads: continuous batching, KV paging, quota enforcement, and DAG orchestration"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
keywords = ["llm", "inference", "scheduler", "continuous-batching", "kv-cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=7.0.0",
]

[project.scripts]
keel = "keel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["keel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
# Exceptions here name conditions, not error types. Suffixed with `Error` they
# stutter (`ContextLengthExceededError`) and read worse at every `except` site.
"src/keel/errors.py" = ["N818"]
# Workload generation needs reproducibility, not unpredictability.
"src/keel/bench/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["keel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true