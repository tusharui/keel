name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests bench
      - name: Ruff format
        run: ruff format --check src tests bench
      - name: Types
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test against SQLite
        run: pytest --cov=keel --cov-report=term-missing --cov-fail-under=80
        env:
          KEEL_DATABASE_URL: sqlite+aiosqlite:///./test.db
      - name: Test against Postgres
        if: matrix.python-version == '3.12'
        # The whole suite, not just tests/db. A dialect bug rarely lives in the
        # persistence tests: it shows up wherever a query, a type or a constraint
        # behaves differently, and narrowing this job to one directory is what
        # let a full-suite Postgres failure sit unnoticed.
        run: pytest --cov=keel --cov-report=term-missing --cov-fail-under=80
        env:
          KEEL_DATABASE_URL: postgresql+asyncpg://keel:keel@localhost:5432/keel_test

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*